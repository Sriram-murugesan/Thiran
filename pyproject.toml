[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "thiran"
version = "0.1.0"
description = "Local AI voice agent with push-to-talk, Ollama LLM, and modular tool dispatch"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "faster-whisper>=1.0.0",
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "keyboard>=0.13.5",
    "aiohttp>=3.9.0",
    "pyttsx3>=2.90",
    "textual>=0.52.1",
    "rich>=13.7.1",
]

[project.optional-dependencies]
coqui = ["TTS>=0.22.0"]
gpu   = ["torch>=2.1.0"]
dev   = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
thiran = "agent:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length    = 100
select         = ["E", "F", "W", "I", "UP", "B"]
ignore         = ["B008"]

[tool.mypy]
python_version         = "3.10"
strict                 = true
ignore_missing_imports = true
